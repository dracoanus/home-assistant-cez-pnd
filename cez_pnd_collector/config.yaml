name: "CEZ PND Collector"
version: "0.3.24"
slug: cez_pnd_collector
description: "Authenticated CEZ PND Collector API (offline deployment-validation stage)."
url: "https://github.com/dracoanus/home-assistant-cez-pnd"
arch:
  - amd64
image: "ghcr.io/dracoanus/home-assistant-cez-pnd-collector"
startup: application
boot: manual
init: false
stage: experimental
timeout: 10
tmpfs: true
host_network: false
host_pid: false
host_ipc: false
host_uts: false
host_dbus: false
hassio_api: false
homeassistant_api: false
auth_api: false
docker_api: false
full_access: false
apparmor: true
audio: false
video: false
gpio: false
usb: false
uart: false
udev: false
devicetree: false
kernel_modules: false
realtime: false
ingress: false
stdin: false
options:
  meter_id: null
  api_token_sha256: null
  tls_certificate_b64: null
  tls_private_key_b64: null
  cez_discovery_mode: false
  cez_http_auth_discovery_mode: false
  cez_requests_preauth_compatibility_mode: false
  cez_data_probe_mode: false
  cez_data_probe_date: null
  cez_ean: null
  cez_elm: null
  cez_allowed_origins: []
schema:
  meter_id: "match(^mtr_[a-f0-9]{32}$)"
  api_token_sha256: "match(^[a-f0-9]{64}$)"
  tls_certificate_b64: password
  tls_private_key_b64: password
  cez_discovery_mode: bool
  cez_http_auth_discovery_mode: bool
  cez_requests_preauth_compatibility_mode: bool
  cez_data_probe_mode: bool
  cez_data_probe_date: str?
  cez_start_url: url?
  cez_auth_origin: url?
  cez_allowed_origins:
    - url
  cez_username: password?
  cez_password: password?
  cez_ean: password?
  cez_elm: password?
